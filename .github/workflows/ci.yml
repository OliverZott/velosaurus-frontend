name: CI

# feature branches / PRs: check
# main:                   check -> publish
on:
  push:
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

# a newer push cancels the older run of the same branch (never on main, so a publish is never interrupted)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: dasmuesli/velosaurus-frontend

jobs:
  # =====================================================================================================
  # lint, format check and build (all branches and PRs)
  check:
    name: Lint, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # same as Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  # =====================================================================================================
  # build image, smoke test the container, push to Docker Hub (main only, after check passed)
  publish:
    name: Publish docker image
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test

      - name: Smoke test container
        run: |
          docker run --detach --name frontend -p 3042:3042 ${{ env.IMAGE }}:test
          curl --fail --silent --show-error --output /dev/null --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3042/

      - name: Show container logs
        if: failure()
        run: docker logs frontend

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # same build as above, layers come from cache
      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Show Docker Hub link
        run: echo "Docker image published to https://hub.docker.com/r/${{ env.IMAGE }}"
