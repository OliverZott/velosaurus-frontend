services:
  velosaurus-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # read at runtime, change without rebuilding the image
      # asp.net core web api use port 7019 (local backend) or 8000 (dockerized backend)
      # nodejs express api use port 3000
      # ACTIVITY_API_URL: http://velosaurus-backend:3000/api/activity
      ACTIVITY_API_URL: http://host.docker.internal:8000/api/v1/activity
      LOCATION_API_URL: http://host.docker.internal:8000/api/v1/location
    image: velosaurus-frontend
    container_name: velosaurus-frontend
    command: npm run start
    ports:
      - "3001:3042"
      - "9229:9229"
